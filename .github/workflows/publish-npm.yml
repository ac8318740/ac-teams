name: Stage npm release

on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/publish-npm.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Check release branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::npm releases can only be staged from main."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Install npm with staged publishing support
        run: npm install -g npm@11.19.0

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run

      - name: Stage release for npm approval
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "::error::Set NPM_TOKEN with stage-publish access to ac-teams."
            exit 1
          fi
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} is already published; nothing to stage."
            exit 0
          fi
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT
          if npm stage publish . --access public --provenance \
            2>&1 | tee "$log"; then
            echo "Approve ${name}@${version} on npmjs.com with 2FA to publish."
            exit 0
          else
            status=$?
          fi
          if grep -q "Version uniqueness check failed unexpectedly" "$log"; then
            echo "${name}@${version} appears to be staged already."
            echo "Approve it on npmjs.com with 2FA to publish."
            exit 0
          fi
          exit "$status"
